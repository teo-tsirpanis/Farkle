version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      test:
        patterns:
          - "Expecto"
          - "Expecto.*"
          - "FsCheck"
          - "Microsoft.Testing.*"
          - "NUnit"
          - "NUnit3TestAdapter"
          - "NUnit.*"
          - "YoloDev.Expecto.TestSdk"
    ignore:
      # Do not automatically update Roslyn.
      - dependency-name: "Microsoft.CodeAnalysis.CSharp"
